version: '3.8'

networks:
  ai-network:
    driver: bridge

volumes:
  qdrant_data:
    driver: local

services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shared-ai-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    networks:
      - ai-network
    depends_on:
      llama-server:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1536M
        reservations:
          cpus: '0.50'
          memory: 512M

  llama-server:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: llama-server
    restart: unless-stopped
    command: >
      /llama-server
      -m /models/qwen2.5-0.5b/qwen2.5-0.5b-instruct-q4_k_m.gguf
      -c 2048
      -n 512
      --host 0.0.0.0
      --port 8080
    volumes:
      - ./models:/models:ro
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '4.00'
          memory: 2048M
        reservations:
          cpus: '1.00'
          memory: 512M

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
