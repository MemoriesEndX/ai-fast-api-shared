<div class="endpoint-card" id="endpoint-card-template">
  <div class="endpoint-header">
    <span class="endpoint-method method-post">POST</span>
    <span class="endpoint-path">/api/v1/endpoint</span>
    <span class="endpoint-summary">Endpoint Summary</span>
  </div>
  <div class="endpoint-body">
    <p class="endpoint-description" style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1.25rem;"></p>
    
    <div class="endpoint-auth-badge" style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; font-size: 0.8rem; color: var(--text-muted);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <span>Security: <strong class="auth-type-text">X-API-Key</strong></span>
    </div>

    <!-- Dynamic Parameters / Schema Section -->
    <div class="endpoint-params-container"></div>

    <!-- Code Examples Snippet Tabs -->
    <div style="margin-top: 1.5rem;">
      <h4 style="font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;">Request Example</h4>
      <div class="snippet-tabs-wrapper"></div>
    </div>

    <!-- Playground expander section -->
    <div class="playground-section">
      <button class="playground-toggle" onclick="window.DocPlayground.togglePlayground(this)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <span>Try It / API Playground</span>
      </button>
      <div class="playground-container" style="display: none;"></div>
    </div>
  </div>
</div>
