<div class="modal-backdrop" id="search-modal">
  <div class="modal-content">
    <div class="modal-header">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--text-muted);">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search-modal-input" class="search-modal-input" placeholder="Search documentation, endpoints, parameters..." autocomplete="off" />
      <span class="kbd-shortcut" style="cursor: pointer;" id="search-modal-close">ESC</span>
    </div>
    <div class="modal-body" id="search-modal-results">
      <div style="padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
        Type to search endpoints, paths, schemas, or guides...
      </div>
    </div>
  </div>
</div>
